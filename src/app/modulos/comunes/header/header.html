<header class="border-b border-slate-300 bg-white dark:bg-gray-800 dark:border-gray-600">
  <div class="mx-auto flex items-center gap-4 px-6 py-4 max-w-full sm:max-w-[1200px]">
    <!-- Logo visible en modo claro, invisible en modo oscuro -->
    <!-- Logo claro -->
    <!-- claro -->
    <img src="assets/optmized/logo-tecnm-40h.webp"
      srcset="assets/optmized/logo-tecnm-40h.webp 1x, assets/optmized/logo-tecnm-80h.webp 2x" width="91" height="40"
      class="h-10 w-auto dark:invisible sm:visible" alt="Logo TecNM" />

    <!-- oscuro -->
    <img src="assets/optmized/logo-tecnm-blanco-40h.webp"
      srcset="assets/optmized/logo-tecnm-blanco-40h.webp 1x, assets/optmized/logo-tecnm-blanco-80h.webp 2x" width="91"
      height="40" class="h-10 w-auto sm:invisible dark:visible" alt="Logo TecNM blanco" />



    <!-- Título -->
    <h1 class="text-2xl font-semibold text-slate-900 dark:text-white flex-1 text-center sm:text-left">
      {{ title }}
    </h1>
  </div>
</header>
