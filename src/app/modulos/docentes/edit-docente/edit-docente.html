<p-toast></p-toast>

<div class="min-h-screen w-full flex dark:bg-gray-800">
  <div class="flex-1 max-w-4xl mx-auto p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Editar docente</h2>
      <a routerLink="/docentes" class="text-blue-600 hover:underline dark:text-blue-400">← Volver</a>
    </div>

    <!-- Formulario -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
      <fieldset class="border rounded p-4 dark:border-gray-600">
        <legend class="px-2 text-sm font-semibold text-slate-900 dark:text-white">Datos del Docente</legend>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-slate-700 dark:text-gray-300">Nombre</label>
            <input type="text" formControlName="nombre" class="mt-1 p-2 w-full border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
          </div>

          <div>
            <label class="block text-sm text-slate-700 dark:text-gray-300">Apellido Paterno</label>
            <input type="text" formControlName="apellidoPaterno" class="mt-1 p-2 w-full border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
          </div>

          <div>
            <label class="block text-sm text-slate-700 dark:text-gray-300">Apellido Materno</label>
            <input type="text" formControlName="apellidoMaterno" class="mt-1 p-2 w-full border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
          </div>

          <div>
            <label class="block text-sm text-slate-700 dark:text-gray-300">Correo institucional</label>
            <input type="email" formControlName="correoInstitucional" class="mt-1 p-2 w-full border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-slate-700 dark:text-gray-300">RFC</label>
            <input type="text" formControlName="RFC" class="mt-1 p-2 w-full border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
          </div>

          <div>
            <label class="block text-sm text-slate-700 dark:text-gray-300">Teléfono</label>
            <input type="text" formControlName="Telefono" class="mt-1 p-2 w-full border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
          </div>
        </div>
      </fieldset>

      <div class="flex gap-3 justify-end">
        <button type="submit"
                class="px-4 py-2 rounded text-white bg-blue-600 hover:bg-blue-700 disabled:opacity-60 dark:bg-blue-500 dark:hover:bg-blue-600">
          Guardar cambios
        </button>
      </div>
    </form>
  </div>
</div>
