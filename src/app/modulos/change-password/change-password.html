<!-- change-password.html -->
<p-toast></p-toast>

<section class="min-h-[calc(100vh-65px)] dark:bg-gray-800 bg-slate-50">
  <div class="mx-auto max-w-xl px-4 py-12">
    <div class="rounded-2xl border border-slate-200 bg-white shadow-sm p-8">
      <h2 class="mb-6 text-center text-slate-700 font-medium">Cambiar contraseña</h2>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <!-- Email solo lectura (del usuario logueado) -->
        <div class="flex items-end gap-3">
          <div class="flex-1">
            <label class="mb-1 block text-sm text-slate-700">Escribe tu correo para enviar el código</label>
            <input type="email" formControlName="email" [readonly]="codeRequested()"
              class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-black outline-none" />


          </div>

          <button type="button"
            class="rounded-full border border-slate-300 px-4 py-2 text-sm hover:bg-slate-100 disabled:opacity-60 dark:bg-gray-800"
            (click)="sendCode()" [disabled]="sendingCode() || cooldown()>0">
            {{ sendingCode() ? 'Enviando…' : 'Enviar código' }}
          </button>
        </div>

        <div class="flex items-end gap-3">
          <div class="flex-1">
            <label class="mb-1 block text-sm text-slate-700">Ingresa el Código de verificación (6 dígitos)</label>
            <input type="text" formControlName="code" inputmode="numeric" maxlength="6"
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-black outline-none focus:ring-2 focus:ring-sky-500" />
            <p *ngIf="invalid('code')" class="mt-1 text-xs text-rose-600">Ingresa el código.</p>
          </div>

        </div>

        <!-- Mostrar cooldown si hay que esperar para enviar otro código -->
        <p *ngIf="cooldown() > 0" class="text-xs text-slate-500">
          Puedes solicitar otro código en {{cooldown()}}s.
        </p>

        <!-- Nueva contraseña -->
        <div>
          <label class="mb-1 block text-sm text-slate-700">Nueva contraseña</label>
          <input [type]="show() ? 'text':'password'" formControlName="newPassword"
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-black outline-none focus:ring-2 focus:ring-sky-500" />
          <p *ngIf="invalid('newPassword')" class="mt-1 text-xs text-rose-600">Mínimo 6 caracteres.</p>
        </div>

        <!-- Confirmar nueva contraseña -->
        <div>
          <label class="mb-1 block text-sm text-slate-700">Confirmar nueva contraseña</label>
          <input [type]="show() ? 'text':'password'" formControlName="confirmNewPassword"
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-black outline-none focus:ring-2 focus:ring-sky-500" />
          <p *ngIf="form.errors?.['passwordMismatch'] && (form.touched || form.dirty)"
            class="mt-1 text-xs text-rose-600">Las contraseñas no coinciden.</p>
        </div>

        <button type="button" class="text-sm text-sky-700" (click)="show.set(!show())">
          {{ show() ? 'Ocultar' : 'Mostrar' }} contraseñas
        </button>

        <!-- Mostrar mensajes de error o éxito -->
        @if(error()){
        <div>
          <div class="rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700">
            {{ error() }}
          </div>
        </div>
        }

        @if(success()){
        <div>
          <div class="rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm text-emerald-700">
            {{ success() }}
          </div>
        </div>
        }

        <!-- Botones -->
        <div class="flex gap-3">
          <button type="submit" [disabled]="loading() || form.invalid || !codeRequested()"
            class="rounded-full bg-slate-900 px-4 py-2 text-sm font-medium text-white disabled:opacity-60">
            @if(loading()){
            <span>…</span>
            }
            Guardar
          </button>

          <a (click)="cancel()"
            class="rounded-full border border-slate-300 px-4 py-2 text-sm dark:bg-gray-800 cursor-pointer">
            Cancelar
          </a>


        </div>
      </form>
    </div>
  </div>
</section>
